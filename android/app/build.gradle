plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}
def requiredSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def missingSigningProperties = requiredSigningProperties.findAll {
    !keystoreProperties[it]?.toString()?.trim()
}
def releaseStoreFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null

if (isReleaseBuild) {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException("Release signing requires android/key.properties.")
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException(
            "Release signing is incomplete. Missing required key.properties entries: " +
            missingSigningProperties.join(", ")
        )
    }
    if (!releaseStoreFile?.isFile()) {
        throw new GradleException("Release signing keystore configured by key.properties was not found.")
    }
}

android {
    namespace = "com.sanctum.vault"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion
    buildFeatures {
        aidl = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }
    defaultConfig {
        applicationId = "com.sanctum.vault"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (isReleaseBuild) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile releaseStoreFile
                storePassword keystoreProperties["storePassword"]
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }
}
flutter {
    source = "../.."
}

dependencies {
    // V-05 biometric auth-bound DEK wrap (DEV-P0-03 B2-5a-native stage 1b).
    // BiometricPrompt + CryptoObject, compat back to API23. Also pulled
    // transitively by local_auth; declared explicitly for compile-time use.
    implementation "androidx.biometric:biometric:1.1.0"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:core-ktx:1.6.1"
    androidTestImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.20"
}
