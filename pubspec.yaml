name: sanctum
description: Sanctum - Your private everything. Offline encrypted vault.
publish_to: 'none'
version: 1.6.0-alpha.1+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Encryption
  cryptography: ^2.7.0
  encrypt: ^5.0.3

  # Secure local storage
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0
  share_plus: ^7.2.2
  image_picker: ^1.1.0
  local_auth: ^2.1.8
  package_info_plus: ^9.0.1

  # File I/O
  path_provider: ^2.1.0

  # File import
  file_picker: ^8.1.2

  # Receipt OCR
  google_mlkit_text_recognition: ^0.13.1

  # Device Transfer
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1
  # flutter_blue_plus: ^1.32.12  # TODO: add back when BLE feature is implemented

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device harness runner for the Argon2id measurement (DEV-P0-03 B2-5a-native
  # stage 1a / TDR-2026-026). SDK-bundled, not a third-party package.
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/
